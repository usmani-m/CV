:root{

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ground);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{color:var(--text)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}

/* header */
header.hero{border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.hero svg.net{position:absolute;right:-40px;top:48px;width:560px;height:auto;opacity:.55;pointer-events:none}
.hero .wrap{position:relative;padding-top:56px;padding-bottom:40px}
.eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin:0 0 14px}
h1{font-size:clamp(34px,6vw,54px);line-height:1.05;margin:0 0 10px;letter-spacing:-.5px;font-weight:600}
.role{font-size:clamp(18px,2.6vw,22px);color:var(--muted);margin:0 0 22px;max-width:640px}
.summary{max-width:680px;margin:0 0 26px;color:var(--text)}
.contacts{display:flex;flex-wrap:wrap;gap:8px 20px;font-family:var(--mono);font-size:14px;margin:0 0 28px;padding:0;list-style:none}
.contacts a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line-strong)}
.contacts a:hover{color:var(--accent);border-color:var(--accent)}

.toggle{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;padding:4px;gap:4px}
.toggle button{border:0;background:transparent;padding:10px 18px;border-radius:999px;cursor:pointer;color:var(--muted);min-height:44px}
.toggle button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.toggle-label{font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:1.5px;text-transform:uppercase;margin:0 0 8px}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:34px}
.stat{background:var(--ground);padding:16px 18px}
.stat b{display:block;font-size:26px;font-weight:600;color:var(--accent);line-height:1.1}
.stat span{font-size:14px;color:var(--muted)}

/* nav + filters */
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--ground) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:none}
.bar a{flex:none;font-family:var(--mono);font-size:13px;color:var(--muted);text-decoration:none;padding:8px 12px;border-radius:6px}
.bar a:hover{color:var(--text);background:var(--panel)}

.filters{padding-top:28px}
.filters h2{font-family:var(--mono);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);font-weight:500;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-strong);background:transparent;border-radius:999px;padding:8px 14px;cursor:pointer;color:var(--muted);font-size:14px;min-height:40px}
.chip:hover{color:var(--text);border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip .n{font-family:var(--mono);font-size:12px;opacity:.7;margin-left:6px}
.status{min-height:24px;margin-top:12px;font-size:14px;color:var(--muted)}
.status button{background:none;border:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:0 4px}

/* sections */
main{display:flex;flex-direction:column}
section.block{padding:40px 0 8px;scroll-margin-top:60px}
.block-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:6px}
.block-head h2{margin:0;font-size:22px;font-weight:600}
.block-head .tools{font-family:var(--mono);font-size:13px}
.block-head .tools button{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px 0;min-height:32px}
.block-head .tools button:hover{color:var(--accent)}

.entry{border-bottom:1px solid var(--line);transition:opacity .2s}
.entry.dim{opacity:.32}
.entry-head{width:100%;display:grid;grid-template-columns:150px minmax(0,1fr) 24px;gap:6px 18px;align-items:start;text-align:left;background:none;border:0;padding:18px 0;cursor:pointer}
.entry-head:hover .t{color:var(--accent)}
.when{font-family:var(--mono);font-size:13px;color:var(--faint);padding-top:3px}
.t{display:block;font-weight:600;font-size:17px;line-height:1.35}
.org{display:block;color:var(--muted);font-size:15px;margin-top:2px}
.chev{width:24px;height:24px;color:var(--faint);transition:transform .2s;margin-top:2px}
.entry-head[aria-expanded="true"] .chev{transform:rotate(180deg);color:var(--accent)}
.entry-body{padding:0 42px 20px 168px}
.entry-body ul{margin:0 0 12px;padding-left:18px}
.entry-body li{margin-bottom:6px}
.entry-body li::marker{color:var(--accent)}
.entry-body p{margin:0 0 12px}
.skilltags{display:flex;flex-wrap:wrap;gap:6px}
.skilltag{font-family:var(--mono);font-size:12px;border:1px solid var(--line-strong);background:transparent;border-radius:4px;padding:5px 8px;cursor:pointer;color:var(--muted);min-height:30px}
.skilltag:hover{border-color:var(--accent);color:var(--accent)}
.badge{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 6px;margin-left:8px;vertical-align:2px;font-weight:500}

.skillgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 32px;padding-top:16px}
.skillgrid h3{font-family:var(--mono);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);font-weight:500;margin:0 0 10px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding-top:16px}
.card{border:1px solid var(--line);border-radius:8px;padding:16px;background:var(--panel)}
.card b{display:block;margin-bottom:4px}
.card span{color:var(--muted);font-size:14px}

footer{border-top:1px solid var(--line);margin-top:48px;padding:28px 0 48px;color:var(--faint);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
.print-btn{background:none;border:1px solid var(--line-strong);border-radius:6px;color:var(--muted);padding:8px 14px;cursor:pointer;min-height:40px}
.print-btn:hover{border-color:var(--accent);color:var(--accent)}

@media (max-width:720px){
  .hero svg.net{width:380px;right:-140px;opacity:.3}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .entry-head{grid-template-columns:minmax(0,1fr) 24px}
  .when{grid-column:1/-1;order:-1;padding-top:0}
  .entry-body{padding:0 0 20px}
  .skillgrid,.cards{grid-template-columns:minmax(0,1fr)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

@media print{

  .bar,.filters,.toggle,.toggle-label,.tools,.chev,.print-btn,.hero svg.net{display:none!important}
  .entry.dim{opacity:1}
  .entry-body{display:block!important;padding-bottom:8px}
  .entry-head{padding:10px 0 4px}
  section.block{padding-top:18px;break-inside:auto}
  .entry{break-inside:avoid}
  .skilltags{display:none}
  .hero .wrap{padding-top:0;padding-bottom:16px}
  .stats{margin-top:16px}
}
</style>

  const hasBody = e.bullets.length || e.skills.length || e.link;
  const body = hasBody ? `
    <div class="entry-body" id="${id}" hidden>
      ${e.bullets.length ? `<ul>${e.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul>` : ""}
      ${e.link ? `<p><a href="${esc(e.link.href)}" target="_blank" rel="noopener">${esc(e.link.label)}</a></p>` : ""}
      ${e.skills.length ? `<div class="skilltags">${e.skills.map(s => `<button type="button" class="skilltag" data-skill="${esc(s)}">${esc(s)}</button>`).join("")}</div>` : ""}
    </div>` : "";
  return `<article class="entry" data-tags="${esc(e.tags.join(" "))}" data-skills="${esc(e.skills.join("|"))}">
    <button type="button" class="entry-head" aria-expanded="false" ${hasBody ? `aria-controls="${id}"` : "disabled style=\"cursor:default\""}>
      <span class="when">${esc(e.when)}</span>
      <span><span class="t">${esc(e.title)}${e.badge ? `<span class="badge">${esc(e.badge)}</span>` : ""}</span><span class="org">${esc(e.org)}</span></span>
      ${hasBody ? chevron : "<span></span>"}
    </button>${body}</article>`;
}

function sectionHTML(key){
  const s = SECTIONS[key];
  let inner = "";
  if (s.kind === "cards") inner = `<div class="cards">${s.items.map(c => `<div class="card"><b>${esc(c.t)}</b><span>${esc(c.s)}</span></div>`).join("")}</div>`;
  else if (s.kind === "skills") {
    const used = {}; allEntries().forEach(e => e.skills.forEach(k => used[k] = (used[k] || 0) + 1));
    inner = `<div class="skillgrid">${Object.entries(SKILLS).map(([g, list]) => `<div><h3>${esc(g)}</h3><div class="chips">${
      list.map(k => `<button type="button" class="chip" data-skill="${esc(k)}" aria-pressed="false">${esc(k)}${used[k] ? `<span class="n">${used[k]}</span>` : ""}</button>`).join("")
    }</div></div>`).join("")}</div>`;
  } else inner = s.items.map(entryHTML).join("");
  const tools = s.kind ? "" : `<span class="tools"><button type="button" data-expand="${key}">Expand all</button></span>`;
  return `<section class="block" id="${key}"><div class="block-head"><h2>${esc(s.title)}</h2>${tools}</div>${inner}</section>`;
}

function renderBody(){
  uid = 0;
  const order = ORDER[state.mode];
  $("#main").innerHTML = order.map(sectionHTML).join("");
  $("#nav").innerHTML = order.map(k => `<a href="#${k}">${esc(SECTIONS[k].title)}</a>`).join("");
  applyFilter();
}

function renderTopics(){
  const count = {}; allEntries().forEach(e => e.tags.forEach(t => count[t] = (count[t] || 0) + 1));
  $("#topics").innerHTML = `<button type="button" class="chip" data-topic="" aria-pressed="true">All</button>` +
    Object.entries(TOPICS).map(([k, v]) => `<button type="button" class="chip" data-topic="${k}" aria-pressed="false">${esc(v)}<span class="n">${count[k] || 0}</span></button>`).join("");
}

function setExpanded(article, open){
  const head = article.querySelector(".entry-head"), body = article.querySelector(".entry-body");
  if (!body) return;
  head.setAttribute("aria-expanded", String(open)); body.hidden = !open;
}

function applyFilter(){
  const f = state.filter; let n = 0;
  document.querySelectorAll(".entry").forEach(a => {
    const match = !f || (f.type === "topic" ? a.dataset.tags.split(" ").includes(f.value) : a.dataset.skills.split("|").includes(f.value));
    a.classList.toggle("dim", !match);
    if (f) { setExpanded(a, match); if (match) n++; }
  });
  document.querySelectorAll("[data-topic]").forEach(b => b.setAttribute("aria-pressed", String(f ? f.type === "topic" && b.dataset.topic === f.value : b.dataset.topic === "")));
  document.querySelectorAll(".chip[data-skill]").forEach(b => b.setAttribute("aria-pressed", String(!!f && f.type === "skill" && b.dataset.skill === f.value)));
  const label = f ? (f.type === "topic" ? TOPICS[f.value] : f.value) : "";
  $("#status").innerHTML = f ? `Highlighting ${n} item${n === 1 ? "" : "s"} for <strong>${esc(label)}</strong> <button type="button" id="clear">Clear filter</button>` : "";
}

document.addEventListener("click", ev => {
  const t = ev.target.closest("button"); if (!t) return;
  if (t.matches(".toggle button")) { state.mode = t.dataset.mode; store.set("cv-mode", state.mode); renderHeader(); renderBody(); return; }
  if (t.matches(".entry-head")) { setExpanded(t.closest(".entry"), t.getAttribute("aria-expanded") !== "true"); return; }
  if (t.dataset.expand) {
    const sec = document.getElementById(t.dataset.expand), arts = sec.querySelectorAll(".entry");
    const open = [...arts].some(a => a.querySelector(".entry-head").getAttribute("aria-expanded") !== "true" && a.querySelector(".entry-body"));
    arts.forEach(a => setExpanded(a, open)); t.textContent = open ? "Collapse all" : "Expand all"; return;
  }
  if ("topic" in t.dataset) { const v = t.dataset.topic; state.filter = v && !(state.filter && state.filter.value === v) ? { type: "topic", value: v } : null; applyFilter(); return; }
  if (t.dataset.skill) {
    const v = t.dataset.skill; state.filter = state.filter && state.filter.value === v ? null : { type: "skill", value: v }; applyFilter();
    if (state.filter && t.classList.contains("chip")) document.querySelector(".filters").scrollIntoView({ behavior: "smooth" });
    return;
  }
  if (t.id === "clear") { state.filter = null; applyFilter(); }
});

window.addEventListener("beforeprint", () => document.querySelectorAll(".entry").forEach(a => setExpanded(a, true)));

$("#contacts").innerHTML = CONTACTS.map(c => `<li>${c.href ? `<a href="${esc(c.href)}"${c.href.startsWith("http") ? ' target="_blank" rel="noopener"' : ""}>${esc(c.label)}</a>` : `<span style="color:var(--muted)">${esc(c.label)}</span>`}</li>`).join("");
$("#stats").innerHTML = STATS.map(s => `<div class="stat"><b>${esc(s.n)}</b><span>${esc(s.t)}</span></div>`).join("");
$("#year").textContent = new Date().getFullYear();
renderHeader(); renderTopics(); renderBody();
</script>
</body>
</html>
